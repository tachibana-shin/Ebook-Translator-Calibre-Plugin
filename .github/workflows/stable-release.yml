name: Publish Stable Release
run-name: 'Publish Stable Release: ${{ github.ref_name }}'

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  branch: master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.branch }}
      - name: Build
        run: |
          make all
          mv plugin.zip Ebook-Translator-Calibre-Plugin_${{ github.ref_name }}.zip
      - name: Changelog
        run: |
          {
            echo 'changelog<<EOF'
            pattern='^## v[0-9](\.[0-9]){2}$'
            while read line && [[ "$line" != '---' ]]; do
              if [[ "$line" =~ $pattern ]]; then
                if [[ ! "$line" =~ ${{ github.ref_name }} ]]; then
                  echo "*[The release notes will be populated soon]*"; break
                fi
                continue
              fi
              echo "$line";
            done < CHANGELOG.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
        id: changelog
      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body: ${{ steps.changelog.outputs.changelog }}
          files: '*.zip'
